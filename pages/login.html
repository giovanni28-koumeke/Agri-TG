<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connexion - Agri TG">
    <title>Connexion - Agri TG</title>

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="../assets/logoAgriTG.jpeg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
</head>

<body class="auth-page">
    <header class="navbar">
        <a href="../index.html" class="logo">Agri <span>TG</span></a>
        <nav>
            <a href="../index.html" class="nav-link">Retour à l'accueil</a>
        </nav>
    </header>

    <main class="page-shell">
        <section id="login-section" class="auth-card">
            <div class="auth-head">
                <h1>Connexion</h1>
                <p class="subtitle">Accédez à votre dashboard Phase 2 et suivez vos finances.</p>
            </div>

            <form id="login-form" class="form-card">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="exemple@agritg.tg" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Mot de passe" required>
                </div>

                <button type="submit" class="btn-primary">Se connecter</button>
            </form>

            <p class="auth-footer-text">Pas encore de compte ? <a href="#">Demander un accès</a></p>
        </section>
    </main>

    <footer class="site-footer simple-footer">
        <p>© 2026 Agri TG. Tous droits réservés.</p>
    </footer>

    <script src="../script.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Empêche le rechargement de la page
            
            // Animation UX (Optionnelle)
            const btn = this.querySelector('button[type="submit"]');
            btn.textContent = "Connexion...";
            btn.disabled = true;
            
            // Redirection vers le dashboard après 1 petite seconde
            setTimeout(() => {
                window.location.href = 'phase2.html';
            }, 800);
        });
    </script>
</body>

</html>
